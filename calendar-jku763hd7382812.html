<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kalendarz Lekcji</title>
  
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/pl.global.min.js"></script>

  <style>
    :root {
      --primary: #1a73e8;
      --bg: #18181c;
      --card-bg: #262631;
      --border: #3a3a4a;
      --text: #ffffff;
      --text-muted: #9aa0a6;
      --success: #1e8e3e;
      --danger: #d93025;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    #calendar-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 6px;
      background: var(--bg);
    }

    #calendar {
      flex: 1;
      min-height: 0;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* FullCalendar Dark Theme & Pełna wysokość */
    .fc {
      height: 100% !important;
      --fc-border-color: var(--border);
      --fc-page-bg-color: var(--card-bg);
      --fc-neutral-bg-color: #202029;
      --fc-list-event-hover-bg-color: #333342;
      --fc-today-bg-color: rgba(26, 115, 232, 0.08);
      font-size: 13px;
    }
    
    .fc .fc-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px !important;
    }

    .fc .fc-toolbar-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .fc .fc-button {
      background-color: #343444;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      text-transform: capitalize;
    }
    .fc .fc-button:hover { background-color: var(--primary); border-color: var(--primary); }
    .fc .fc-button-active { background-color: var(--primary) !important; border-color: var(--primary) !important; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
    .fc-col-header-cell-cushion { color: var(--text-muted); padding: 6px 0; text-decoration: none; }
    .fc-timegrid-slot-label-cushion { color: var(--text-muted); font-size: 11px; }

    /* Zwiększenie czytelności kafelków na telefonie */
    .fc-timegrid-event {
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 12px;
    }

    /* Modal Formularza */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: #22222c;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      overflow: hidden;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 12px 16px;
      background: #2a2a37;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 15px;
    }

    .modal-close {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      line-height: 1;
      padding: 0 4px;
    }

    .modal-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-control {
      background: #181820;
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checkbox-row {
      display: flex;
      gap: 20px;
      padding: 6px 0;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
    }

    .modal-footer {
      padding: 12px 16px;
      background: #1c1c24;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: #343444; color: white; }

    @media (max-width: 600px) {
      #calendar-container { padding: 2px; }
      #calendar { padding: 4px; border-radius: 0; border: none; }
      .fc .fc-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .fc .fc-toolbar-chunk {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="calendar-container">
  <div id="calendar"></div>
</div>

<!-- Modal Formularza -->
<div class="modal-overlay" id="eventModal">
  <div class="modal-card">
    <div class="modal-header">
      <span id="modalTitle">Zaplanuj lekcję</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editRowId" value="">

      <div class="form-group">
        <label>Uczeń</label>
        <select id="studentSelect" class="form-control" onchange="onStudentChange()">
          <option value="">-- Wybierz ucznia --</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Od</label>
          <input type="datetime-local" id="startTime" class="form-control" onchange="recalculateHours()">
        </div>
        <div class="form-group">
          <label>Do</label>
          <input type="datetime-local" id="endTime" class="form-control" onchange="recalculateHours()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Godzin (auto)</label>
          <input type="number" step="0.5" id="hoursCount" class="form-control" readonly style="opacity: 0.65;">
        </div>
        <div class="form-group">
          <label>Kwota (auto)</label>
          <input type="number" id="totalAmount" class="form-control" readonly style="opacity: 0.65;">
        </div>
      </div>

      <div class="form-group">
        <label>Płatność</label>
        <select id="payType" class="form-control">
          <option value="Gotówka">Gotówka</option>
          <option value="Przelew">Przelew</option>
          <option value="">Nieokreślono</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notatki / Temat</label>
        <input type="text" id="lessonNotes" class="form-control" placeholder="np. Geometria, Potęgowanie">
      </div>

      <div class="checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="isCompleted"> Zrealizowano
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="isPaid"> Opłacono
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDelete" onclick="deleteLesson()" style="display: none;">Usuń</button>
      <div style="display: flex; gap: 8px; margin-left: auto;">
        <button class="btn btn-secondary" onclick="closeModal()">Anuluj</button>
        <button class="btn btn-primary" onclick="saveLesson()">Zapisz</button>
      </div>
    </div>
  </div>
</div>
