<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalendarz Lekcji</title>
  
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <!-- FullCalendar CSS & JS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/pl.global.min.js"></script>

  <style>
    :root {
      --primary: #1a73e8;
      --bg: #1e1e24;
      --card-bg: #2b2b36;
      --border: #3f3f4e;
      --text: #ffffff;
      --text-muted: #9aa0a6;
      --success: #1e8e3e;
      --danger: #d93025;
      --warning: #f2994a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181c;
      color: var(--text);
    }

    #calendar {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* FullCalendar - motyw ciemny */
    .fc {
      --fc-border-color: var(--border);
      --fc-page-bg-color: var(--card-bg);
      --fc-neutral-bg-color: #24242d;
      --fc-list-event-hover-bg-color: #383846;
      --fc-today-bg-color: rgba(26, 115, 232, 0.08);
      font-size: 13px;
    }
    .fc .fc-toolbar-title { font-size: 18px; font-weight: 600; color: #fff; }
    .fc .fc-button-primary {
      background-color: #383846;
      border-color: var(--border);
      color: #fff;
    }
    .fc .fc-button-primary:hover { background-color: var(--primary); border-color: var(--primary); }
    .fc .fc-button-active { background-color: var(--primary) !important; border-color: var(--primary) !important; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
    .fc-col-header-cell-cushion { color: var(--text-muted); padding: 8px 0; }
    .fc-timegrid-slot-label-cushion { color: var(--text-muted); }

    /* Modal Formularza */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: #252530;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      background: #2d2d3a;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 15px;
    }

    .modal-close {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
    }

    .modal-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-control {
      background: #1c1c24;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-row {
      display: flex;
      gap: 20px;
      padding-top: 4px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-footer {
      padding: 12px 18px;
      background: #20202a;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b3261e; }
    .btn-secondary { background: #383846; color: white; }
  </style>
</head>
<body>

<div id="calendar"></div>

<!-- Modal Dodawania / Edycji -->
<div class="modal-overlay" id="eventModal">
  <div class="modal-card">
    <div class="modal-header">
      <span id="modalTitle">Zaplanuj lekcję</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editRowId" value="">

      <div class="form-group">
        <label>Uczeń</label>
        <select id="studentSelect" class="form-control" onchange="onStudentChange()">
          <option value="">-- Wybierz ucznia --</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Od</label>
          <input type="datetime-local" id="startTime" class="form-control" onchange="recalculateHours()">
        </div>
        <div class="form-group">
          <label>Do</label>
          <input type="datetime-local" id="endTime" class="form-control" onchange="recalculateHours()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Godzin</label>
          <input type="number" step="0.5" id="hoursCount" class="form-control" onchange="recalculateAmount()">
        </div>
        <div class="form-group">
          <label>Kwota (zł)</label>
          <input type="number" step="10" id="totalAmount" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Płatność</label>
        <select id="payType" class="form-control">
          <option value="Gotówka">Gotówka</option>
          <option value="Przelew">Przelew</option>
          <option value="">Nieokreślono</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notatki / Temat</label>
        <input type="text" id="lessonNotes" class="form-control" placeholder="np. Geometria, Potęgowanie">
      </div>

      <div class="checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="isCompleted"> Zrealizowano
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="isPaid"> Opłacono
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDelete" onclick="deleteLesson()" style="display: none;">Usuń</button>
      <div style="display: flex; gap: 8px; margin-left: auto;">
        <button class="btn btn-secondary" onclick="closeModal()">Anuluj</button>
        <button class="btn btn-primary" onclick="saveLesson()">Zapisz</button>
      </div>
    </div>
  </div>
</div>

<script>
  grist.ready({ requiredAccess: 'full' });

  let calendar;
  let activeStudents = [];
  let studentsMap = {};

  function toLocalISO(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  async function loadStudents() {
    try {
      const tableData = await grist.docApi.fetchTable('Uczniowie');
      const select = document.getElementById('studentSelect');
      select.innerHTML = '<option value="">-- Wybierz ucznia --</option>';

      activeStudents = [];
      studentsMap = {};

      const count = tableData.id.length;
      for (let i = 0; i < count; i++) {
        const student = {
          id: tableData.id[i],
          name: tableData.Imie_i_nazwisko[i],
          rate: Number(tableData['Stawka__h_'] ? tableData['Stawka__h_'][i] : (tableData.Stawka ? tableData.Stawka[i] : 100)) || 100,
          active: Boolean(tableData.Aktywny[i])
        };

        studentsMap[student.id] = student;

        if (student.active) {
          activeStudents.push(student);
          const opt = document.createElement('option');
          opt.value = student.id;
          opt.textContent = `${student.name} (${student.rate} zł/h)`;
          select.appendChild(opt);
        }
      }
    } catch (e) {
      console.error('Błąd pobierania uczniów:', e);
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await loadStudents();

    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      locale: 'pl',
      initialView: window.innerWidth < 768 ? 'timeGridDay' : 'timeGridWeek',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'timeGridWeek,timeGridDay,listWeek'
      },
      slotMinTime: '07:00:00',
      slotMaxTime: '22:00:00',
      allDaySlot: false,
      selectable: true,
      selectMirror: true,
      editable: true,

      select: function(info) {
        openModalForNew(info.start, info.end);
      },

      eventClick: function(info) {
        openModalForEdit(info.event);
      },

      eventDrop: async function(info) {
        await updateEventTimes(info.event);
      },

      eventResize: async function(info) {
        await updateEventTimes(info.event);
      }
    });

    calendar.render();
  });

  grist.onRecords((records) => {
    if (!calendar) return;

    const events = (records || []).map(row => {
      const startSec = typeof row.Data_rozpoczecia === 'number' ? row.Data_rozpoczecia : new Date(row.Data_rozpoczecia).getTime() / 1000;
      const endSec = typeof row.Data_zakonczenia === 'number' ? row.Data_zakonczenia : new Date(row.Data_zakonczenia).getTime() / 1000;

      const isCompleted = Boolean(row.Zrealizowano);
      const isPaid = Boolean(row.Czy_zaplacono || row._Czy_zaplacono || row['$Czy_zaplacono']);
      const studentName = row.Imie_i_nazwisko_text || row.Imie_i_nazwisko || 'Lekcja';

      let bgColor = '#5f6368';
      if (isCompleted && isPaid) bgColor = '#1e8e3e';
      else if (isCompleted && !isPaid) bgColor = '#d93025';

      return {
        id: String(row.id),
        title: `${studentName}${row.Notatki ? ' - ' + row.Notatki : ''}`,
        start: new Date(startSec * 1000),
        end: new Date(endSec * 1000),
        backgroundColor: bgColor,
        borderColor: bgColor,
        extendedProps: { raw: row }
      };
    });

    calendar.removeAllEvents();
    calendar.addEventSource(events);
  });

  function openModalForNew(start, end) {
    document.getElementById('editRowId').value = '';
    document.getElementById('modalTitle').textContent = 'Zaplanuj lekcję';
    document.getElementById('btnDelete').style.display = 'none';

    document.getElementById('studentSelect').value = '';
    document.getElementById('startTime').value = toLocalISO(start);
    document.getElementById('endTime').value = toLocalISO(end);
    document.getElementById('lessonNotes').value = '';
    document.getElementById('isCompleted').checked = false;
    document.getElementById('isPaid').checked = false;
    document.getElementById('payType').value = 'Gotówka';

    recalculateHours();
    document.getElementById('eventModal').classList.add('active');
  }

  function openModalForEdit(event) {
    const row = event.extendedProps.raw;
    document.getElementById('editRowId').value = row.id;
    document.getElementById('modalTitle').textContent = 'Edytuj lekcję';
    document.getElementById('btnDelete').style.display = 'block';

    document.getElementById('studentSelect').value = typeof row.Imie_i_nazwisko === 'object' ? row.Imie_i_nazwisko.id : row.Imie_i_nazwisko;
    document.getElementById('startTime').value = toLocalISO(event.start);
    document.getElementById('endTime').value = toLocalISO(event.end);
    document.getElementById('hoursCount').value = row.Godzin || 1;
    document.getElementById('totalAmount').value = row.Kwota || 100;
    document.getElementById('lessonNotes').value = row.Notatki || '';
    document.getElementById('isCompleted').checked = Boolean(row.Zrealizowano);
    document.getElementById('isPaid').checked = Boolean(row.Czy_zaplacono || row._Czy_zaplacono || row['$Czy_zaplacono']);
    document.getElementById('payType').value = row.Typ_platnosci || 'Gotówka';

    document.getElementById('eventModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('eventModal').classList.remove('active');
  }

  function onStudentChange() {
    recalculateAmount();
  }

  function recalculateHours() {
    const start = new Date(document.getElementById('startTime').value);
    const end = new Date(document.getElementById('endTime').value);
    if (!isNaN(start) && !isNaN(end) && end > start) {
      const diffHours = (end - start) / (1000 * 60 * 60);
      document.getElementById('hoursCount').value = Math.round(diffHours * 10) / 10;
    }
    recalculateAmount();
  }

  function recalculateAmount() {
    const sId = document.getElementById('studentSelect').value;
    const hours = Number(document.getElementById('hoursCount').value) || 0;
    const rate = (sId && studentsMap[sId]) ? studentsMap[sId].rate : 100;
    document.getElementById('totalAmount').value = Math.round(hours * rate);
  }

  async function saveLesson() {
    const rowId = document.getElementById('editRowId').value;
    const studentId = Number(document.getElementById('studentSelect').value);

    if (!studentId) {
      alert('Wybierz ucznia z listy!');
      return;
    }

    const start = new Date(document.getElementById('startTime').value);
    const end = new Date(document.getElementById('endTime').value);

    const recordFields = {
      Imie_i_nazwisko: studentId,
      Data_rozpoczecia: Math.floor(start.getTime() / 1000),
      Data_zakonczenia: Math.floor(end.getTime() / 1000),
      Godzin: Number(document.getElementById('hoursCount').value),
      Kwota: Number(document.getElementById('totalAmount').value),
      Notatki: document.getElementById('lessonNotes').value,
      Zrealizowano: document.getElementById('isCompleted').checked,
      Czy_zaplacono: document.getElementById('isPaid').checked,
      Typ_platnosci: document.getElementById('payType').value
    };

    try {
      if (rowId) {
        await grist.docApi.applyUserActions([['UpdateRecord', 'Lekcje', Number(rowId), recordFields]]);
      } else {
        await grist.docApi.applyUserActions([['AddRecord', 'Lekcje', null, recordFields]]);
      }
      closeModal();
    } catch (e) {
      alert('Błąd zapisu: ' + e.message);
    }
  }

  async function deleteLesson() {
    const rowId = document.getElementById('editRowId').value;
    if (!rowId) return;

    if (confirm('Czy na pewno chcesz usunąć tę lekcję?')) {
      try {
        await grist.docApi.applyUserActions([['RemoveRecord', 'Lekcje', Number(rowId)]]);
        closeModal();
      } catch (e) {
        alert('Błąd usuwania: ' + e.message);
      }
    }
  }

  async function updateEventTimes(event) {
    const diffHours = (event.end - event.start) / (1000 * 60 * 60);
    const hours = Math.round(diffHours * 10) / 10;
    const row = event.extendedProps.raw;
    const sId = typeof row.Imie_i_nazwisko === 'object' ? row.Imie_i_nazwisko.id : row.Imie_i_nazwisko;
    const rate = (sId && studentsMap[sId]) ? studentsMap[sId].rate : 100;

    await grist.docApi.applyUserActions([['UpdateRecord', 'Lekcje', Number(event.id), {
      Data_rozpoczecia: Math.floor(event.start.getTime() / 1000),
      Data_zakonczenia: Math.floor(event.end.getTime() / 1000),
      Godzin: hours,
      Kwota: Math.round(hours * rate)
    }]]);
  }
</script>
</body>
</html>
