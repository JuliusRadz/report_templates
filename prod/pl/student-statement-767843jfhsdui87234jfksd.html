<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raport Lekcji</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #1a1a1a;
      background: #fff;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #f8f9fa;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .controls label {
      font-size: 13px;
      font-weight: bold;
      color: #444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls input[type="date"] {
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    .reset-btn {
      padding: 6px 12px;
      background: #e0e0e0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .reset-btn:hover { background: #d0d0d0; }

    .header {
      border-bottom: 2px solid #2b2b2b;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }
    .student-name {
      font-size: 16px;
      color: #333;
    }
    .gen-date {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }
    
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    tfoot td {
      font-weight: bold;
      background-color: #fafafa;
    }
    .col-center { text-align: center; }
    .col-right { text-align: right; }
    .col-fit {
      width: 1%;
      white-space: nowrap;
    }

    .print-btn {
      padding: 8px 16px;
      background: #0b57d0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .print-btn:hover { background: #0842a0; }

    /* RWD dla smartfonów */
    @media (max-width: 600px) {
      body {
        margin: 10px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .controls .spacer {
        display: none;
      }
      .controls label {
        justify-content: space-between;
      }
      .controls input[type="date"] {
        flex-grow: 1;
      }
      .print-btn, .reset-btn {
        width: 100%;
        text-align: center;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      h1 {
        font-size: 18px;
      }
    }

    /* Reguły druku / PDF */
    @media print {
      .controls { display: none !important; }
      body { margin: 0; padding: 10mm; }
      .table-container { overflow-x: visible; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

  <!-- Pasek filtrów i drukowania -->
  <div class="controls">
    <button class="print-btn" onclick="window.print()">Drukuj / Zapisz PDF</button>
    <div class="spacer" style="flex-grow: 1;"></div>
    <label>
      Od:
      <input type="date" id="dateFrom" onchange="renderReport()">
    </label>
    <label>
      Do:
      <input type="date" id="dateTo" onchange="renderReport()">
    </label>
    <button class="reset-btn" onclick="clearFilters()">Wyczyść filtr</button>
  </div>

  <div class="header">
    <div>
      <h1>Raport zrealizowanych lekcji</h1>
      <div class="student-name" id="studentHeader">Uczeń: —</div>
    </div>
    <div class="gen-date" id="reportDate"></div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-fit col-center">Lp.</th>
          <th class="col-fit">Termin</th>
          <th class="col-fit col-center">Godz.</th>
          <th>Temat / Notatki</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="col-center">Wybierz ucznia w tabeli obok.</td></tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2" class="col-right">Łącznie:</td>
          <td class="col-fit col-center" id="totalHours">0 h</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

</html>
