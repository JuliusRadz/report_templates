<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raport Lekcji</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #1a1a1a;
      background: #fff;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #f8f9fa;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .controls label {
      font-size: 13px;
      font-weight: bold;
      color: #444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls input[type="date"] {
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    .reset-btn {
      padding: 6px 12px;
      background: #e0e0e0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .reset-btn:hover { background: #d0d0d0; }

    .header {
      border-bottom: 2px solid #2b2b2b;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }
    .student-name {
      font-size: 16px;
      color: #333;
    }
    .gen-date {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }
    
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    tfoot td {
      font-weight: bold;
      background-color: #fafafa;
    }
    .col-center { text-align: center; }
    .col-right { text-align: right; }
    .col-fit {
      width: 1%;
      white-space: nowrap;
    }

    .print-btn {
      padding: 8px 16px;
      background: #0b57d0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .print-btn:hover { background: #0842a0; }

    @media (max-width: 600px) {
      body { margin: 10px; }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .controls .spacer { display: none; }
      .controls label { justify-content: space-between; }
      .controls input[type="date"] { flex-grow: 1; }
      .print-btn, .reset-btn { width: 100%; text-align: center; }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      h1 { font-size: 18px; }
    }

    @media print {
      .controls { display: none !important; }
      body { margin: 0; padding: 10mm; }
      .table-container { overflow-x: visible; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="print-btn" onclick="window.print()">Drukuj / Zapisz PDF</button>
    <div class="spacer" style="flex-grow: 1;"></div>
    <label>
      Od:
      <input type="date" id="dateFrom" onchange="renderReport()">
    </label>
    <label>
      Do:
      <input type="date" id="dateTo" onchange="renderReport()">
    </label>
    <button class="reset-btn" onclick="clearFilters()">Wyczyść filtr</button>
  </div>

  <div class="header">
    <div>
      <h1>Raport zrealizowanych lekcji</h1>
      <div class="student-name" id="studentHeader">Uczeń: —</div>
    </div>
    <div class="gen-date" id="reportDate"></div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-fit col-center">Lp.</th>
          <th class="col-fit">Termin</th>
          <th class="col-fit col-center">Godz.</th>
          <th>Temat / Notatki</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="col-center">Wybierz ucznia w tabeli obok.</td></tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2" class="col-right">Łącznie:</td>
          <td class="col-fit col-center" id="totalHours">0 h</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    grist.ready({ requiredAccess: 'read table' });

    let rawRecordsCache = [];
    let studentsMap = {};

    function parseDate(val) {
      if (!val) return null;
      const d = typeof val === 'number' ? new Date(val * 1000) : new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatGristDate(d) {
      if (!d) return '—';
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      const hours = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year} ${hours}:${mins}`;
    }

    async function loadStudents() {
      try {
        const data = await grist.docApi.fetchTable('Students');
        if (data && data.id && data.FullName) {
          const names = data.FullName;
          for (let i = 0; i < data.id.length; i++) {
            studentsMap[data.id[i]] = names[i];
          }
        }
      } catch (e) {
        console.error("Błąd pobierania bazy uczniów:", e);
      }
    }

    loadStudents();

    function renderReport() {
      const tbody = document.getElementById('tableBody');
      const studentElem = document.getElementById('studentHeader');
      const totalHoursElem = document.getElementById('totalHours');

      document.getElementById('reportDate').textContent = `Data: ${new Date().toLocaleDateString('pl-PL')}`;

      if (!rawRecordsCache || rawRecordsCache.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="col-center">Brak lekcji do wyświetlenia.</td></tr>';
        studentElem.innerHTML = 'Uczeń: —';
        totalHoursElem.textContent = '0 h';
        return;
      }

      const rawRef = rawRecordsCache[0].StudentId;
      studentElem.innerHTML = `<strong>Uczeń:</strong> ${studentsMap[rawRef] || rawRef || '—'}`;

      const fromVal = document.getElementById('dateFrom').value;
      const toVal = document.getElementById('dateTo').value;
      const dateFrom = fromVal ? new Date(fromVal + 'T00:00:00') : null;
      const dateTo = toVal ? new Date(toVal + 'T23:59:59') : null;

      let rowsHtml = '';
      let sumHours = 0;
      let visibleIndex = 0;

      rawRecordsCache.forEach((row) => {
        const d = parseDate(row.LessonStartDateTime);

        if (d) {
          if (dateFrom && d < dateFrom) return;
          if (dateTo && d > dateTo) return;
        }

        visibleIndex++;
        const notes = row.LessonNotes || '—';
        const hours = Number(row.Hours) || 0;
        sumHours += hours;

        rowsHtml += `
          <tr>
            <td class="col-fit col-center">${visibleIndex}</td>
            <td class="col-fit">${formatGristDate(d)}</td>
            <td class="col-fit col-center">${hours}</td>
            <td>${String(notes).replace(/\n/g, '<br>')}</td>
          </tr>
        `;
      });

      if (visibleIndex === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="col-center">Brak lekcji w wybranym przedziale dat.</td></tr>';
      } else {
        tbody.innerHTML = rowsHtml;
      }

      totalHoursElem.textContent = `${sumHours} h`;
    }

    function clearFilters() {
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      renderReport();
    }

    grist.onRecords((records) => {
      rawRecordsCache = records || [];
      renderReport();
    });
  </script>
</body>
</html>
